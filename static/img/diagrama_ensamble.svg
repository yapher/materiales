<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter, sans-serif">
  <rect width="900" height="300" fill="#1e1730" rx="14"/>

  <!-- Panel izquierdo: Bagging (RandomForest / ExtraTrees) -->
  <text x="225" y="30" fill="#88c999" font-size="14" text-anchor="middle" font-weight="700">Bagging (RandomForest / ExtraTrees)</text>
  <text x="225" y="48" fill="#9c93b8" font-size="10.5" text-anchor="middle">árboles EN PARALELO, sobre submuestras distintas</text>

  <g stroke="#88c999" stroke-width="1.5" fill="none">
    <path d="M90 190 L60 130" /><path d="M90 190 L120 130" />
    <path d="M195 190 L165 130" /><path d="M195 190 L225 130" />
    <path d="M300 190 L270 130" /><path d="M300 190 L330 130" />
  </g>
  <g fill="#251c3d" stroke="#6b4fa0" stroke-width="1.5">
    <polygon points="60,95 90,130 30,130" /><text x="60" y="122" fill="#c9a3f2" font-size="9" text-anchor="middle">árbol 1</text>
    <polygon points="120,95 150,130 90,130" /><text x="120" y="122" fill="#c9a3f2" font-size="9" text-anchor="middle">árbol 2</text>
    <polygon points="165,95 195,130 135,130" /><text x="165" y="122" fill="#c9a3f2" font-size="9" text-anchor="middle">árbol 3</text>
    <polygon points="225,95 255,130 195,130" /><text x="225" y="122" fill="#c9a3f2" font-size="9" text-anchor="middle">árbol 4</text>
    <polygon points="270,95 300,130 240,130" /><text x="270" y="122" fill="#c9a3f2" font-size="9" text-anchor="middle">árbol N</text>
  </g>
  <rect x="145" y="188" width="160" height="34" rx="8" fill="#1e3a2a" stroke="#88c999" stroke-width="1.5"/>
  <text x="225" y="209" fill="#88c999" font-size="11" text-anchor="middle" font-weight="700">Promedio de las N predicciones</text>

  <!-- separador -->
  <line x1="450" y1="20" x2="450" y2="280" stroke="#2f2547" stroke-width="1.5"/>

  <!-- Panel derecho: Boosting (GradientBoosting) -->
  <text x="675" y="30" fill="#e0a97f" font-size="14" text-anchor="middle" font-weight="700">Boosting (GradientBoosting)</text>
  <text x="675" y="48" fill="#9c93b8" font-size="10.5" text-anchor="middle">árboles EN SECUENCIA, cada uno corrige al anterior</text>

  <g font-size="9" fill="#c9a3f2">
    <rect x="510" y="90" width="70" height="36" rx="6" fill="#251c3d" stroke="#6b4fa0" stroke-width="1.5"/>
    <text x="545" y="112" text-anchor="middle">árbol 1</text>

    <rect x="610" y="90" width="70" height="36" rx="6" fill="#251c3d" stroke="#6b4fa0" stroke-width="1.5"/>
    <text x="645" y="112" text-anchor="middle">árbol 2</text>

    <rect x="710" y="90" width="70" height="36" rx="6" fill="#251c3d" stroke="#6b4fa0" stroke-width="1.5"/>
    <text x="745" y="112" text-anchor="middle">árbol 3</text>

    <text x="820" y="112" text-anchor="middle" fill="#9c93b8">...</text>
  </g>

  <g stroke="#e0a97f" stroke-width="1.5" fill="none" marker-end="url(#flechaB)">
    <path d="M580 108 L610 108"/>
    <path d="M680 108 L710 108"/>
    <path d="M780 108 L800 108"/>
  </g>
  <defs>
    <marker id="flechaB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a97f"/>
    </marker>
  </defs>

  <text x="675" y="150" fill="#9c93b8" font-size="10" text-anchor="middle">cada árbol nuevo aprende del error (residuo) que dejó el anterior</text>

  <rect x="595" y="188" width="160" height="34" rx="8" fill="#3a281e" stroke="#e0a97f" stroke-width="1.5"/>
  <text x="675" y="209" fill="#e0a97f" font-size="11" text-anchor="middle" font-weight="700">Suma acumulada de correcciones</text>
</svg>
