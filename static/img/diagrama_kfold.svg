<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Inter, sans-serif">
  <rect width="700" height="260" fill="#1e1730" rx="14"/>
  <text x="350" y="28" fill="#f1eefc" font-size="14" text-anchor="middle" font-weight="700">Validación cruzada K-Fold (K=5)</text>

  <!-- 5 filas, cada una con 5 bloques; el bloque resaltado es el fold de test de esa iteracion -->
  <g font-size="10.5">
    <!-- fila labels -->
    <text x="30" y="60" fill="#9c93b8" text-anchor="start">Iteración</text>

    <!-- helper: cada fila y=50+i*36, bloques de 100px de ancho, 5 bloques desde x=130 -->
  </g>

  <g id="filas">
    <!-- Iteracion 1: test = bloque 1 -->
    <text x="20" y="72" fill="#c9a3f2" font-size="11">1</text>
    <rect x="130" y="58" width="100" height="26" fill="#e0a97f" rx="4"/>
    <rect x="234" y="58" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="338" y="58" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="442" y="58" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="546" y="58" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>

    <!-- Iteracion 2: test = bloque 2 -->
    <text x="20" y="108" fill="#c9a3f2" font-size="11">2</text>
    <rect x="130" y="94" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="234" y="94" width="100" height="26" fill="#e0a97f" rx="4"/>
    <rect x="338" y="94" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="442" y="94" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="546" y="94" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>

    <!-- Iteracion 3: test = bloque 3 -->
    <text x="20" y="144" fill="#c9a3f2" font-size="11">3</text>
    <rect x="130" y="130" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="234" y="130" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="338" y="130" width="100" height="26" fill="#e0a97f" rx="4"/>
    <rect x="442" y="130" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="546" y="130" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>

    <!-- Iteracion 4: test = bloque 4 -->
    <text x="20" y="180" fill="#c9a3f2" font-size="11">4</text>
    <rect x="130" y="166" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="234" y="166" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="338" y="166" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="442" y="166" width="100" height="26" fill="#e0a97f" rx="4"/>
    <rect x="546" y="166" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>

    <!-- Iteracion 5: test = bloque 5 -->
    <text x="20" y="216" fill="#c9a3f2" font-size="11">5</text>
    <rect x="130" y="202" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="234" y="202" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="338" y="202" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="442" y="202" width="100" height="26" fill="#88c999" rx="4" opacity="0.55"/>
    <rect x="546" y="202" width="100" height="26" fill="#e0a97f" rx="4"/>
  </g>

  <!-- leyenda -->
  <rect x="130" y="238" width="14" height="14" fill="#88c999" opacity="0.55" rx="3"/>
  <text x="150" y="249" fill="#9c93b8" font-size="10.5">Entrenamiento</text>
  <rect x="280" y="238" width="14" height="14" fill="#e0a97f" rx="3"/>
  <text x="300" y="249" fill="#9c93b8" font-size="10.5">Validación (out-of-fold)</text>
</svg>
