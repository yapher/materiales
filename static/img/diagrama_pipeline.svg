<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Inter, sans-serif">
  <rect width="900" height="260" fill="#1e1730" rx="14"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c93b8"/>
    </marker>
  </defs>

  <!-- Caja 1: Dataset -->
  <rect x="20" y="90" width="130" height="80" rx="10" fill="#251c3d" stroke="#88c999" stroke-width="1.5"/>
  <text x="85" y="122" fill="#f1eefc" font-size="13" text-anchor="middle" font-weight="600">Dataset</text>
  <text x="85" y="140" fill="#9c93b8" font-size="10.5" text-anchor="middle">composición +</text>
  <text x="85" y="153" fill="#9c93b8" font-size="10.5" text-anchor="middle">temperatura</text>

  <line x1="150" y1="130" x2="190" y2="130" stroke="#9c93b8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- Caja 2: 3 modelos candidatos -->
  <rect x="195" y="60" width="150" height="140" rx="10" fill="#251c3d" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="270" y="80" fill="#f1eefc" font-size="12" text-anchor="middle" font-weight="600">Candidatos</text>
  <rect x="210" y="90" width="120" height="24" rx="5" fill="#14101f"/>
  <text x="270" y="106" fill="#c9a3f2" font-size="10" text-anchor="middle">RandomForest</text>
  <rect x="210" y="120" width="120" height="24" rx="5" fill="#14101f"/>
  <text x="270" y="136" fill="#c9a3f2" font-size="10" text-anchor="middle">ExtraTrees</text>
  <rect x="210" y="150" width="120" height="24" rx="5" fill="#14101f"/>
  <text x="270" y="166" fill="#c9a3f2" font-size="10" text-anchor="middle">GradientBoosting</text>

  <line x1="345" y1="130" x2="385" y2="130" stroke="#9c93b8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- Caja 3: K-Fold -->
  <rect x="390" y="90" width="150" height="80" rx="10" fill="#251c3d" stroke="#88c999" stroke-width="1.5"/>
  <text x="465" y="118" fill="#f1eefc" font-size="12" text-anchor="middle" font-weight="600">Validación</text>
  <text x="465" y="134" fill="#f1eefc" font-size="12" text-anchor="middle" font-weight="600">cruzada K-Fold</text>
  <text x="465" y="152" fill="#9c93b8" font-size="10">R² out-of-fold</text>

  <line x1="540" y1="130" x2="580" y2="130" stroke="#9c93b8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- Caja 4: Mejor modelo -->
  <rect x="585" y="90" width="130" height="80" rx="10" fill="#251c3d" stroke="#e0c26f" stroke-width="1.5"/>
  <text x="650" y="122" fill="#f1eefc" font-size="12" text-anchor="middle" font-weight="600">Se elige el</text>
  <text x="650" y="138" fill="#f2d879" font-size="12" text-anchor="middle" font-weight="700">mejor R²</text>
  <text x="650" y="154" fill="#9c93b8" font-size="9.5">por variable</text>

  <line x1="715" y1="130" x2="755" y2="130" stroke="#9c93b8" stroke-width="1.5" marker-end="url(#flecha)"/>

  <!-- Caja 5: Modelo final -->
  <rect x="760" y="90" width="120" height="80" rx="10" fill="#1e3a2a" stroke="#88c999" stroke-width="2"/>
  <text x="820" y="120" fill="#88c999" font-size="12" text-anchor="middle" font-weight="700">Reentrenado</text>
  <text x="820" y="138" fill="#88c999" font-size="12" text-anchor="middle" font-weight="700">con TODO</text>
  <text x="820" y="154" fill="#9c93b8" font-size="9.5">el dataset</text>

  <text x="450" y="230" fill="#9c93b8" font-size="11" text-anchor="middle">Este proceso se repite, de forma independiente, para CADA propiedad del material.</text>
</svg>
