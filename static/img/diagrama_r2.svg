<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Inter, sans-serif">
  <rect width="640" height="300" fill="#1e1730" rx="14"/>
  <text x="320" y="28" fill="#f1eefc" font-size="14" text-anchor="middle" font-weight="700">Interpretación del R² (coeficiente de determinación)</text>

  <!-- Panel izquierdo: buen ajuste -->
  <g>
    <text x="150" y="52" fill="#88c999" font-size="11.5" text-anchor="middle" font-weight="700">R² alto (≈ 0.9)</text>
    <rect x="40" y="65" width="220" height="170" fill="#14101f" rx="8" stroke="#2f2547"/>
    <line x1="50" y1="220" x2="250" y2="220" stroke="#9c93b8" stroke-width="1"/>
    <line x1="50" y1="75" x2="50" y2="220" stroke="#9c93b8" stroke-width="1"/>
    <line x1="55" y1="210" x2="245" y2="85" stroke="#88c999" stroke-width="2"/>
    <g fill="#c9a3f2">
      <circle cx="70" cy="200" r="3.5"/><circle cx="95" cy="185" r="3.5"/>
      <circle cx="120" cy="170" r="3.5"/><circle cx="145" cy="150" r="3.5"/>
      <circle cx="170" cy="135" r="3.5"/><circle cx="195" cy="118" r="3.5"/>
      <circle cx="220" cy="100" r="3.5"/><circle cx="235" cy="92" r="3.5"/>
    </g>
    <text x="150" y="250" fill="#9c93b8" font-size="9.5" text-anchor="middle">Los puntos (predicción vs real) caen casi</text>
    <text x="150" y="262" fill="#9c93b8" font-size="9.5" text-anchor="middle">sobre la línea ideal: el modelo explica</text>
    <text x="150" y="274" fill="#9c93b8" font-size="9.5" text-anchor="middle">casi toda la variabilidad de los datos.</text>
  </g>

  <!-- Panel derecho: mal ajuste -->
  <g>
    <text x="480" y="52" fill="#e07f7f" font-size="11.5" text-anchor="middle" font-weight="700">R² bajo (≈ 0.2)</text>
    <rect x="370" y="65" width="220" height="170" fill="#14101f" rx="8" stroke="#2f2547"/>
    <line x1="380" y1="220" x2="580" y2="220" stroke="#9c93b8" stroke-width="1"/>
    <line x1="380" y1="75" x2="380" y2="220" stroke="#9c93b8" stroke-width="1"/>
    <line x1="385" y1="210" x2="575" y2="85" stroke="#e07f7f" stroke-width="2" stroke-dasharray="4,4"/>
    <g fill="#c9a3f2">
      <circle cx="400" cy="120" r="3.5"/><circle cx="425" cy="200" r="3.5"/>
      <circle cx="450" cy="100" r="3.5"/><circle cx="475" cy="180" r="3.5"/>
      <circle cx="500" cy="140" r="3.5"/><circle cx="525" cy="95" r="3.5"/>
      <circle cx="550" cy="190" r="3.5"/><circle cx="565" cy="130" r="3.5"/>
    </g>
    <text x="480" y="250" fill="#9c93b8" font-size="9.5" text-anchor="middle">Los puntos estan muy dispersos respecto</text>
    <text x="480" y="262" fill="#9c93b8" font-size="9.5" text-anchor="middle">a la línea ideal: el modelo predice poco</text>
    <text x="480" y="274" fill="#9c93b8" font-size="9.5" text-anchor="middle">mejor que usar siempre el promedio.</text>
  </g>
</svg>
