<!--
Botón flotante para abrir el gráfico densidad vs. temperatura.
Se incluye en el panel de composición de la mezcla.
-->
<button
    type="button"
    class="btn-grafico-densidad"
    data-bs-toggle="modal"
    data-bs-target="#modalGraficoDensidad"
    title="Gráfico densidad vs. temperatura"
    aria-label="Abrir gráfico de densidad vs. temperatura"
>
    <i class="bi bi-graph-up-arrow"></i>
</button>
