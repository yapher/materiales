<div class="row g-2 align-items-end mb-3">
    <div class="col-md-5">
        <label class="form-label label-sm">Elemento</label>

        <select id="elementoSel" class="form-select">
            <option value="">Seleccionar...</option>

            {% for e in elementos %}
                <option value="{{ e }}">{{ e }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label label-sm">Porcentaje</label>

        <input
            type="number"
            id="porcentajeSel"
            class="form-control"
            value="100"
            min="0"
            max="100"
            step="any"
        >
    </div>

    <div class="col-md-3">
        <button
            id="btnAgregarElemento"
            class="btn btn-agregar w-100"
            onclick="agregarElemento()"
        >
            <i class="bi bi-plus-lg"></i> Agregar
        </button>
    </div>
</div>
