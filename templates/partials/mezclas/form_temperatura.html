<div class="row g-2 align-items-end mb-3">
    <div class="col-md-5">
        <label class="form-label label-sm" for="temperatura">
            Temperatura (K)
        </label>

        <input
            type="number"
            id="temperatura"
            class="form-control"
            placeholder="Ej: 1673"
            min="0"
            step="any"
        >
    </div>

    <div class="col-md-3">
        <button
            id="btnPredecir"
            class="btn btn-accion w-100"
            onclick="predecir()"
            disabled
            style="display:none;"
        >
            <i class="bi bi-graph-up-arrow"></i> Predecir
        </button>
    </div>
</div>
