<div
    class="modal fade"
    id="modalConfiguracionEntrenamiento"
    tabindex="-1"
    aria-hidden="true"
    data-variable-default="{{ variable_entrenable_default | default('Densidad_kg_m3') }}"
>
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content panel configuracion-entrenamiento">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-gear-fill"></i> Configuración de modelado
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                ></button>
            </div>

            <div class="modal-body">

                <p class="text-muted mb-3">
                    Seleccioná las variables que querés modelar.
                    Si no configurás nada, quedará seleccionada
                    <strong>Densidad</strong> por defecto.
                </p>

                <div class="config-acciones mb-3">
                    <button
                        type="button"
                        class="btn btn-agregar btn-sm"
                        id="btnConfigurarDensidad"
                    >
                        <i class="bi bi-star"></i> Usar Densidad
                    </button>

                    <button
                        type="button"
                        class="btn btn-accion btn-sm"
                        id="btnLimpiarVariables"
                    >
                        <i class="bi bi-eraser"></i> Limpiar selección
                    </button>
                </div>

                <div id="configVariablesGrid" class="config-variables-grid">
                    {% for variable in variables_entrenables | default([]) %}
                        <button
                            type="button"
                            class="variable-toggle"
                            data-variable="{{ variable.valor }}"
                            data-etiqueta="{{ variable.etiqueta }}"
                            aria-pressed="false"
                            title="{{ variable.descripcion | default(variable.etiqueta) }}"
                        >
                            <span class="variable-toggle-check">
                                <i class="bi bi-check-lg"></i>
                            </span>

                            <span class="variable-toggle-texto">
                                {{ variable.etiqueta }}
                            </span>

                            <span class="variable-toggle-codigo">
                                {{ variable.valor }}
                            </span>
                        </button>
                    {% endfor %}
                </div>

                <div
                    id="configAdvertencia"
                    class="config-advertencia mt-3"
                    style="display:none;"
                >
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Tenés que seleccionar al menos una variable para modelar.
                </div>

            </div>

            <div class="modal-footer">
                <span
                    id="configContador"
                    class="config-contador text-muted me-auto"
                >
                    0 variables seleccionadas
                </span>

                <button
                    type="button"
                    class="btn btn-agregar"
                    data-bs-dismiss="modal"
                >
                    Cerrar
                </button>
            </div>

        </div>
    </div>
</div>
